_schema-version: "3.3.0"
ID: BTP_BOOTCAMP
description: SAP CAP Bootcamp - Activity 2
version: 1.0.0

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  - name: BTP_BOOTCAMP-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    requires:
      - name: BTP_BOOTCAMP-auth
      - name: BTP_BOOTCAMP-db

  - name: BTP_BOOTCAMP-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: BTP_BOOTCAMP-db
        properties:
          TARGET_CONTAINER: ~{hdi-container-name}

resources:
  - name: BTP_BOOTCAMP-auth
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: XSUAA-BTP_BOOTCAMP

  - name: BTP_BOOTCAMP-db
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: BTP_BOOTCAMP-db
    properties:
      hdi-container-name: ${service-name}